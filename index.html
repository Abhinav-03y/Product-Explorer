<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Explorer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Product Explorer</h1>
        <p>Find products closest to your target price</p>
    </header>

    <main>

        <section class="price-finder">

            <h2>Smart Price Finder</h2>

            <div class="search-box">
                <input 
                    type="number" 
                    id="priceInput" 
                    placeholder="Enter target price"
                >

                <button id="searchBtn">
                    Search
                </button>
            </div>

        </section>


        <section class="results">

            <h2>Closest Products</h2>

            <div id="productContainer" class="product-container">
                <!-- Products will come here -->
            </div>

        </section>

    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
